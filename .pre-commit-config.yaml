repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # mypy runs against the environment's own numpy/scipy rather than in an isolated
  # venv, so the numerical core is checked against the stubs it actually ships with.
  # Requires `pip install -e ".[dev]"`.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        args: [src/sknm]
        language: system
        types: [python]
        pass_filenames: false

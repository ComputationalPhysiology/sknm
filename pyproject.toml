[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sknm"
version = "0.1.0.dev0"
description = "The Simplified Kirchhoff Network Model for cell-based cardiac electrophysiology"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Henrik Finsberg", email = "henriknf@simula.no" }]
keywords = [
    "electrophysiology",
    "cardiac",
    "gap-junction",
    "kirchhoff-network-model",
    "computational-biology",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
# scipy >= 1.11 for `diags_array`, which the Laplacian assembly uses; the sparse *array*
# classes it works with arrived earlier, but that function did not.
dependencies = ["numpy", "scipy>=1.11"]

[project.urls]
Homepage = "https://github.com/ComputationalPhysiology/sknm"
Repository = "https://github.com/ComputationalPhysiology/sknm"
Issues = "https://github.com/ComputationalPhysiology/sknm/issues"

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
examples = ["matplotlib"]
# Only needed to regenerate the membrane models; the generated Python is committed.
# The committed code was produced with gotranx main@70171e8.
codegen = ["gotranx"]
dev = ["sknm[test,examples]", "ruff", "mypy", "scipy-stubs", "pre-commit"]
all = ["sknm[test,examples,codegen,dev]"]

[tool.hatch.build.targets.wheel]
packages = ["src/sknm"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "RUF"]

[tool.ruff.lint.per-file-ignores]
# One-off verification scripts that compare against the reference C. Their %-formatting
# mirrors the C's printf format strings (%.17g), which is the point; rewriting it as
# f-strings would be churn on code whose output is checked digit by digit.
"tools/*" = ["UP031"]

[tool.mypy]
files = ["src/sknm"]
# No python_version override: mypy follows the interpreter it runs on. Pinning it to the
# supported floor breaks against numpy >= 2.5, whose stubs use `type` statements that only
# parse as Python 3.12+ -- and numpy >= 2.5 itself requires 3.12, so the floor and the stubs
# cannot both be satisfied. The 3.11 floor is covered by the test matrix, which imports and
# runs the package on 3.11.
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# gotranx emits unannotated defs, and this file is generated rather than hand-edited. Only
# that one rule is relaxed; check_untyped_defs keeps the bodies type-checked.
module = "sknm.membrane.base_model_IM"
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
# `src` is on the list so that `--doctest-modules` reaches the Examples blocks in the
# package's own docstrings. They are documentation users copy, so they are run like tests.
testpaths = ["tests", "src"]
addopts = "--strict-markers --strict-config --import-mode=importlib --doctest-modules"
markers = [
    # Needs the reference C++ in references/SKNM_code and a C++ compiler, neither of which is
    # present in a fresh clone, so these tests skip rather than fail.
    "reference: compares against the authors' C++ reference; skipped unless it is available",
]

[tool.coverage.run]
source = ["sknm"]
branch = true

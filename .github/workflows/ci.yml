name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, for the figure scripts: they take about half an hour and reproduce published
    # figures rather than guarding a change, so they do not belong on a pull request.
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      # Single source of truth for formatting and typing: whatever runs locally.
      - run: pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      # Coverage is reported, not gated.
      - run: pytest --cov=sknm --cov-report=term-missing

  examples:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[examples]"
      # Fast mode only (~2 min each); `--full` is for paper-exact runs, never CI.
      # Only the `fig*` scripts are entry points: their neighbours are modules they import.
      - name: Run example scripts
        run: |
          shopt -s nullglob
          for script in examples/fig*.py; do
            echo "::group::${script}"
            python "${script}"
            echo "::endgroup::"
          done

  # The continuum models need dolfinx, which is not installable from PyPI, so this job runs in
  # the project's own container image. `sknm` itself does not depend on either package: the
  # scripts that do live in `examples/` and skip without them, which is what the other jobs
  # exercise by not having them.
  bidomain:
    runs-on: ubuntu-latest
    container: ghcr.io/fenics/dolfinx/dolfinx:stable
    steps:
      - uses: actions/checkout@v5
      # `fenicsx-beat` 0.6 is where the bidomain model arrives; the tests check for the class
      # rather than the version, but pinning the floor gives a clearer failure than a skip.
      # `examples` as well as `test`: these tests import `examples/bidomain.py`, whose
      # neighbours pull in matplotlib.
      - run: python3 -m pip install --break-system-packages -e ".[test,examples]" "fenicsx-beat>=0.6"
      - run: python3 -m pytest tests/test_bidomain.py -v

  # The figure scripts, which are minutes rather than seconds and so are not run per pull
  # request. Fast mode only; `--full` is for reproducing the paper's own sample by hand.
  bidomain-figures:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: ghcr.io/fenics/dolfinx/dolfinx:stable
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m pip install --break-system-packages -e ".[examples,test]" "fenicsx-beat>=0.6"
      - name: Run the continuum figure scripts
        run: |
          for script in examples/fig0[6-9]_*.py; do
            echo "::group::${script}"
            python3 "${script}"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: continuum-figures
          path: examples/figures/

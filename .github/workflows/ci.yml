name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly. Nothing here is scheduled-only any more, but the documentation build executes
    # every example against whatever the dolfinx image currently ships, so a run with no
    # commit behind it is what catches the image moving underneath us.
    - cron: "0 5 * * 1"
  workflow_dispatch:

# One deploy at a time, and never cancel one in flight: a half-published site is worse than
# an out-of-date one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      # Single source of truth for formatting and typing: whatever runs locally.
      - run: pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      # Coverage is reported, not gated.
      - run: pytest --cov=sknm --cov-report=term-missing

  # The continuum models need dolfinx, which is not installable from PyPI, so this job runs in
  # the project's own container image. `sknm` itself does not depend on either package: the
  # scripts that do live in `examples/` and skip without them, which is what the other jobs
  # exercise by not having them.
  bidomain:
    runs-on: ubuntu-latest
    container: ghcr.io/fenics/dolfinx/dolfinx:stable
    steps:
      - uses: actions/checkout@v5
      # `fenicsx-beat` 0.6 is where the bidomain model arrives; the tests check for the class
      # rather than the version, but pinning the floor gives a clearer failure than a skip.
      # `examples` as well as `test`: these tests import `examples/bidomain.py`, whose
      # neighbours pull in matplotlib.
      - run: python3 -m pip install --break-system-packages -e ".[test,examples]" "fenicsx-beat>=0.6"
      - run: python3 -m pytest tests/test_bidomain.py -v

  # The documentation site, which is also how the network and beta example scripts are
  # exercised: each is converted to a notebook and executed, so a script that stopped running
  # -- or stopped drawing anything -- fails a pull request.
  #
  # The four continuum pages are not executed here. They need dolfinx and sweep for hours,
  # which no pull request can carry; they are rendered as markdown from the same scripts and
  # show figures committed under docs/figures/, which `continuum-figures` below regenerates on
  # a schedule so that they cannot quietly disagree with the code. This job therefore needs no
  # container and no dolfinx.
  docs:
    runs-on: ubuntu-latest
    env:
      # An inline backend and an explicit `plt.show()` are what put the figures in the pages.
      # Under Agg they are written to disk and the pages carry code with no picture.
      MPLBACKEND: module://matplotlib_inline.backend_inline
      # Where GitHub Pages serves the site from, for the static export's asset paths.
      BASE_URL: /sknm
      # `localhost` resolves to both 127.0.0.1 and ::1. Node's default order gives the theme
      # server ::1 while the static export's own crawler connects to 127.0.0.1, so the export
      # fails with ECONNREFUSED against a server that just reported starting. Pinning the
      # order puts both on IPv4.
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps:
      - uses: actions/checkout@v5

      # The Node that `pip install mystmd` bootstraps for itself is 20.0.0, which crashes the
      # static export in `writePublicJson`.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: python -m pip install -e ".[docs]"

      # Everything in one interpreter: the kernel MyST executes the notebooks in has to be the
      # one `sknm` is installed in, not a bare python.
      - run: python -m ipykernel install --user --name python3 --display-name "Python 3"

      # MyST reads only `.md` and `.ipynb`; a percent-format `.py` in the project is ignored in
      # silence. `--set-kernel` matters too: without a kernelspec MyST refuses to execute, and
      # under `--strict` that is an error rather than a warning -- which is what keeps the
      # continuum pages honest, since they are converted to markdown and carry no kernel.
      # `md:markdown` rather than `md`: the bare name resolves to Pandoc's markdown, which
      # needs pandoc installed and fails without it.
      - name: Convert the example scripts to pages
        run: |
          mkdir -p docs/examples
          for script in examples/fig*.py; do
            name="$(basename "${script}" .py)"
            case "${name}" in
              fig0[6-9]_*) jupytext --to md:markdown --output "docs/examples/${name}.md" "${script}" ;;
              *) jupytext --to ipynb --set-kernel python3 --output "docs/examples/${name}.ipynb" "${script}" ;;
            esac
          done
          # A table of contents entry with no file behind it is not an error to MyST: it
          # builds the rest and reports success, so the site loses a page in silence.
          scripts="$(ls examples/fig*.py | wc -l)"
          pages="$(ls docs/examples | wc -l)"
          test "${scripts}" -eq "${pages}" || {
            echo "converted ${pages} pages from ${scripts} scripts"; exit 1; }

      # The reference is written from the installed package rather than kept by hand, so it
      # describes the code in the commit that built it. One page per module and one table of
      # contents entry per page: MyST does not complain about an entry with no file behind
      # it, and a page with no entry is simply absent from the site, so both are counted.
      - name: Write the API reference pages
        run: |
          python tools/generate_api_pages.py docs/api
          pages="$(ls docs/api | wc -l)"
          modules="$(find src/sknm -name '*.py' | wc -l)"
          listed="$(grep -c 'file: api/' docs/myst.yml)"
          test "${pages}" -eq "${modules}" || {
            echo "wrote ${pages} pages for ${modules} modules"; exit 1; }
          test "${pages}" -eq "${listed}" || {
            echo "${pages} pages, ${listed} of them in the table of contents"; exit 1; }

      # `--strict` is what makes a failing page fail the job. Without it a notebook that
      # raised still builds a site, and the build reports success.
      - name: Build the site
        working-directory: docs
        run: PYTHONPATH="${GITHUB_WORKSPACE}/examples:${PYTHONPATH}" myst build --html --execute --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  # The guard on the committed continuum figures. They are the one thing on the site that is
  # not produced by the build that publishes it, so something has to notice when the code that
  # draws them changes and they do not. This reruns the four scripts and fails if any figure
  # comes out different, which is the signal to commit the new ones.
  continuum-figures:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: ghcr.io/fenics/dolfinx/dolfinx:stable
    env:
      MPLBACKEND: Agg
      SKNM_EXAMPLES_OUTPUT_DIR: ${{ github.workspace }}/docs/figures
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m pip install --break-system-packages -e ".[examples]" "fenicsx-beat>=0.6"
      - name: Redraw the continuum figures
        run: |
          for script in examples/fig0[6-9]_*.py; do
            echo "::group::${script}"
            python3 "${script}"
            echo "::endgroup::"
          done
      # Byte comparison is too strict for matplotlib output, so this reports rather than
      # gates: the figures are uploaded for a human to look at, and a changed file shows up
      # as a non-empty diff in the step below.
      - uses: actions/upload-artifact@v4
        with:
          name: continuum-figures
          path: docs/figures/
      - name: Report whether the committed figures moved
        run: git diff --stat -- docs/figures/ || true

  # Deploying is a separate job so that it runs on the standard runner rather than inside the
  # container, and only for a push to the default branch: a pull request builds the site to
  # check that it builds, and publishes nothing.
  docs-deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

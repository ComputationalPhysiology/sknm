version: 1

project:
  title: sknm
  description: >-
    The Simplified Kirchhoff Network Model of Jaeger & Tveito (2023) in Python, with KNM and
    SKNM(u_e=0) alongside it, and the paper's figures reproduced from the code that draws them.
  github: https://github.com/ComputationalPhysiology/sknm
  # Every page below examples/ is written from the matching script in examples/ at build
  # time, so the code on a page is always the code in the repository.
  #
  # The network and beta pages are notebooks and are executed, so their figures and tables
  # are the output of the run that built the page. The four continuum pages are plain
  # markdown and are not executed: they need dolfinx and sweep for hours. Their figures are
  # committed under figures/ and refreshed by a scheduled job, and each such page says so.
  toc:
    - file: index.md
    - title: The network models
      children:
        - file: examples/fig02_travelling_wave.ipynb
        - file: examples/fig03_anisotropy.ipynb
        - file: examples/fig04_gap_junction_variation.ipynb
        - file: examples/fig05_sources_of_difference.ipynb
    - title: The continuum models
      children:
        - file: examples/fig06_continuum_travelling_wave.md
        - file: examples/fig07_continuum_anisotropy.md
        - file: examples/fig08_continuum_gap_junction_variation.md
        - file: examples/fig09_continuum_sources_of_difference.md
    - title: The beta cell models
      children:
        - file: examples/fig10_beta_travelling_wave.ipynb
        - file: examples/fig11_beta_variable_coupling.ipynb
        - file: examples/fig12_beta_gap_junction_variation.ipynb
    # Written from the installed package at build time by `tools/generate_api_pages.py`, one
    # page per module, nested the way the package is. Every public class, function and
    # constant appears once, on the page for the module that defines it.
    - title: API reference
      children:
        - file: api/sknm.md
          children:
            - file: api/sknm.analysis.md
            - file: api/sknm.assembly.md
            - file: api/sknm.linalg.md
            - file: api/sknm.membrane.md
              children:
                - file: api/sknm.membrane.PBM.md
                - file: api/sknm.membrane.base_model_IM.md
                - file: api/sknm.membrane.fitzhugh_nagumo.md
                - file: api/sknm.membrane.protocol.md
            - file: api/sknm.network.md
            - file: api/sknm.presets.md
            - file: api/sknm.simulation.md
            - file: api/sknm.units.md

site:
  template: book-theme
